

services:
  mongo:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27018:27017"
    volumes :
      - mongo-db:/data/db
    networks:
      - app-network

  boot-app:
    image: batchlcwd/chatback
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/chatapp
      - APP_AUTH_JWT_SECRET=${APP_AUTH_JWT_SECRET:?Set APP_AUTH_JWT_SECRET in .env}
      - APP_AUTH_JWT_EXPIRATION_MINUTES=${APP_AUTH_JWT_EXPIRATION_MINUTES:-60}
      - APP_AUTH_WEBSOCKET_TOKEN_EXPIRATION_MINUTES=${APP_AUTH_WEBSOCKET_TOKEN_EXPIRATION_MINUTES:-2}
      - APP_AUTH_COOKIE_SECURE=${APP_AUTH_COOKIE_SECURE:-false}
      - APP_AUTH_COOKIE_SAME_SITE=${APP_AUTH_COOKIE_SAME_SITE:-Lax}
      - APP_CORS_ALLOWED_ORIGIN=${APP_CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      - mongo
    networks:
      - app-network

volumes:
  mongo-db:

networks:
  app-network:
