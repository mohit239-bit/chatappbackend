spring.application.name=chat-app-backend
server.port=8080
spring.config.import=optional:file:.env[.properties]

# Database configuration with env fallback
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://pokhariyamohit239_db_user:lovecoding123@cluster0.qmezjqv.mongodb.net/chatapp?appName=Cluster0}
spring.data.mongodb.auto-index-creation=true

# Spring AI Google GenAI configuration
#spring.ai.google.genai.api-key=${GEMINI_API_KEY}

#spring.ai.google.genai.chat.options.temperature=0.3

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model:phi3
spring.ai.ollama.chat.options.temperature=0.3
spring.ai.ollama.chat.options.format=json

# Custom Application AI Configuration
app.ai.recent-message-limit=25
app.ai.max-message-length=1000
app.ai.request-timeout-seconds=15
app.ai.suggestions-per-request=3
app.ai.draft-rate-limit-per-minute=20
app.ai.suggestion-rate-limit-per-minute=5

# Authentication and browser integration. Set these with environment variables outside local development.
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET}
app.auth.jwt-expiration-minutes=${APP_AUTH_JWT_EXPIRATION_MINUTES:60}
app.auth.web-socket-token-expiration-minutes=${APP_AUTH_WEBSOCKET_TOKEN_EXPIRATION_MINUTES:2}
app.auth.cookie-name=${APP_AUTH_COOKIE_NAME:chat_access_token}
app.auth.cookie-secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie-same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
